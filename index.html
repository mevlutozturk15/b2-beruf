<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DTB B2 Beruf App</title>
    
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="B2 Beruf App">
    
    <link rel="manifest" id="manifestPlaceholder">

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #eceff1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; user-select: none; }
        .app-container { background: #ffffff; width: 100%; max-width: 550px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); padding: 20px; text-align: center; }
        h1 { font-size: 1.2rem; color: #2c3e50; margin-top: 0; margin-bottom: 15px; }
        
        .pwa-banner { display: none; background: #e74c3c; color: white; padding: 10px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 15px; cursor: pointer; font-weight: bold; }

        .mode-selector { display: flex; gap: 8px; margin-bottom: 15px; }
        .mode-btn { flex: 1; padding: 12px; border: 2px solid #3498db; background: #fff; color: #3498db; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .mode-btn.active { background: #3498db; color: #fff; }

        .config-panel { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #bdc3c7; font-size: 0.95rem; background: #fafafa; outline: none; }

        /* Flashcard Modu */
        .card { perspective: 1000px; width: 100%; height: 210px; cursor: pointer; margin-bottom: 15px; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .card-front { background: #2c3e50; color: #fff; }
        .card-back { background: #27ae60; color: #fff; transform: rotateY(180deg); }
        .word { font-size: 1.4rem; font-weight: bold; margin-bottom: 8px; }
        .context { font-size: 0.9rem; opacity: 0.9; line-height: 1.3; }

        /* Quiz Modu */
        .quiz-container { display: none; text-align: left; }
        .quiz-question { background: #34495e; color: #fff; padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .opt-btn { width: 100%; padding: 14px; border: 1px solid #bdc3c7; background: #f8f9fa; border-radius: 10px; text-align: left; font-size: 0.95rem; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .opt-btn.correct { background: #2ecc71 !important; color: white; border-color: #27ae60; }
        .opt-btn.wrong { background: #e74c3c !important; color: white; border-color: #c0392b; }

        .controls { display: flex; gap: 10px; margin-bottom: 10px; }
        .ctrl-btn { flex: 1; padding: 14px; border: none; border-radius: 10px; color: #fff; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        .btn-know { background: #2ecc71; }
        .btn-dontknow { background: #e74c3c; }
        .btn-next { background: #2c3e50; }
        .ctrl-btn:active { opacity: 0.8; }
        
        .reset-btn { background: #e67e22; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; margin-top: 10px; }
        .stats { margin-top: 8px; font-size: 0.85rem; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="pwaInstallBanner" class="pwa-banner" onclick="installPWA()">📲 Uygulamayı Ana Ekrana Yüklemek İçin Tıklayın</div>
    
    <h1>DTB B2 Beruf Kelime & Quiz App</h1>

    <div class="mode-selector">
        <button class="mode-btn active" id="btnFlashcard" onclick="setAppMode('flashcard')">Kart Modu</button>
        <button class="mode-btn" id="btnQuiz" onclick="setAppMode('quiz')">Quiz Modu</button>
    </div>

    <div class="config-panel">
        <select id="directionSelect" onchange="initApp()">
            <option value="DE_TR">Almanca → Türkçe</option>
            <option value="TR_DE">Türkçe → Almanca</option>
        </select>
        <select id="categorySelect" onchange="initApp()">
            <option value="ALL">Tüm Konular (500+ Kelime)</option>
            <option value="Vertrag">İş Sözleşmesi & Haklar</option>
            <option value="Bewerbung">İş Başvurusu & İlanlar</option>
            <option value="Beschwerde">Şikayet Mektubu & Çözümler</option>
            <option value="Telefonnotiz">Telefon Notları & Görüşmeler</option>
            <option value="Sicherheit">İş Güvenliği, Sağlık & DSGVO</option>
            <option value="NomenVerb">Nomen-Verb-Verbindungen</option>
            <option value="Redemittel">Mündlich & Forum Kalıpları</option>
        </select>
    </div>

    <!-- FLASHCARD MODU -->
    <div id="flashcardMode">
        <div class="card" id="flashcard" onclick="flipCard()">
            <div class="card-inner">
                <div class="card-front">
                    <div class="word" id="frontWord">-</div>
                    <div class="context" id="frontContext">-</div>
                </div>
                <div class="card-back">
                    <div class="word" id="backWord">-</div>
                    <div class="context" id="backContext">-</div>
                </div>
            </div>
        </div>
        
        <div class="controls" id="cardActionButtons">
            <button class="ctrl-btn btn-dontknow" onclick="markCard(false)">Bilmiyorum ❌</button>
            <button class="ctrl-btn btn-know" onclick="markCard(true)">Biliyorum ✅</button>
        </div>
    </div>

    <!-- QUIZ MODU -->
    <div id="quizMode" class="quiz-container">
        <div class="quiz-question" id="quizQuestion">Soru Yükleniyor...</div>
        <div class="quiz-options" id="quizOptions"></div>
        <button class="ctrl-btn btn-next" style="width:100%" onclick="nextQuizQuestion()">Sonraki Soru</button>
    </div>

    <div class="stats" id="statsBar">Öğrenilecek: 0 | Bilinen: 0</div>
    <button class="reset-btn" onclick="resetProgress()">Öğrenme İlerlemesini Sıfırla</button>
</div>

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('pwaInstallBanner').style.display = 'block';
});

function installPWA() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
                document.getElementById('pwaInstallBanner').style.display = 'none';
            }
            deferredPrompt = null;
        });
    }
}

let activeList = [];
let learnedIds = new Set();
let currentIndex = 0;
let isFlipped = false;
let appMode = 'flashcard';

function setAppMode(mode) {
    appMode = mode;
    document.getElementById('btnFlashcard').classList.toggle('active', mode === 'flashcard');
    document.getElementById('btnQuiz').classList.toggle('active', mode === 'quiz');
    
    document.getElementById('flashcardMode').style.display = (mode === 'flashcard') ? 'block' : 'none';
    document.getElementById('quizMode').style.display = (mode === 'quiz') ? 'block' : 'none';
    
    initApp();
}

function initApp() {
    const selectedCat = document.getElementById('categorySelect').value;
    
    // Kategoriye göre filtrele
    let categoryFiltered = (selectedCat === "ALL") 
        ? rawVocabulary 
        : rawVocabulary.filter(item => item.cat === selectedCat);

    // Sadece öğrenilmemiş kelimeleri aktif listeye al
    activeList = categoryFiltered.filter(item => !learnedIds.has(item.id));

    currentIndex = 0;
    if (appMode === 'flashcard') {
        updateFlashcard();
    } else {
        updateQuiz();
    }
}

function updateFlashcard() {
    isFlipped = false;
    document.getElementById('flashcard').classList.remove('flipped');

    if (activeList.length === 0) {
        document.getElementById('frontWord').innerText = "Tebrikler! 🎉";
        document.getElementById('frontContext').innerText = "Bu kategorideki tüm kelimeleri öğrendiniz.";
        document.getElementById('backWord').innerText = "Tebrikler!";
        document.getElementById('backContext').innerText = "Sıfırlayarak tekrar çalışabilirsiniz.";
        document.getElementById('cardActionButtons').style.display = 'none';
        updateStats();
        return;
    }

    document.getElementById('cardActionButtons').style.display = 'flex';
    const direction = document.getElementById('directionSelect').value;
    const item = activeList[currentIndex];

    if (direction === "DE_TR") {
        document.getElementById('frontWord').innerText = item.de;
        document.getElementById('frontContext').innerText = item.deC;
        document.getElementById('backWord').innerText = item.tr;
        document.getElementById('backContext').innerText = item.trC;
    } else {
        document.getElementById('frontWord').innerText = item.tr;
        document.getElementById('frontContext').innerText = item.trC;
        document.getElementById('backWord').innerText = item.de;
        document.getElementById('backContext').innerText = item.deC;
    }

    updateStats();
}

function flipCard() {
    if (activeList.length === 0) return;
    isFlipped = !isFlipped;
    document.getElementById('flashcard').classList.toggle('flipped');
}

function markCard(knows) {
    if (activeList.length === 0) return;

    const currentItem = activeList[currentIndex];

    if (knows) {
        // Biliyorum: Öğrenilenlere ekle ve listeden çıkar
        learnedIds.add(currentItem.id);
        activeList.splice(currentIndex, 1);
        if (currentIndex >= activeList.length) {
            currentIndex = 0;
        }
    } else {
        // Bilmiyorum: Sona ertele, sıradaki kelimeye geç
        currentIndex = (currentIndex + 1) % activeList.length;
    }

    updateFlashcard();
}

function updateStats() {
    const selectedCat = document.getElementById('categorySelect').value;
    let totalInCat = (selectedCat === "ALL") ? rawVocabulary.length : rawVocabulary.filter(x => x.cat === selectedCat).length;
    let learnedInCat = (selectedCat === "ALL") 
        ? learnedIds.size 
        : rawVocabulary.filter(x => x.cat === selectedCat && learnedIds.has(x.id)).length;

    document.getElementById('statsBar').innerText = `Kalan / Öğrenilecek: ${activeList.length} | Öğrenilen: ${learnedInCat} / ${totalInCat}`;
}

function resetProgress() {
    learnedIds.clear();
    initApp();
}

// QUIZ MANTIĞI
function updateQuiz() {
    if (activeList.length === 0) {
        document.getElementById('quizQuestion').innerText = "Tebrikler! 🎉";
        document.getElementById('quizOptions').innerHTML = "<p style='text-align:center;'>Tüm kelimeler tamamlandı!</p>";
        updateStats();
        return;
    }

    const direction = document.getElementById('directionSelect').value;
    const currentItem = activeList[currentIndex];

    let questionText = (direction === "DE_TR") ? currentItem.de : currentItem.tr;
    let correctAnswer = (direction === "DE_TR") ? currentItem.tr : currentItem.de;

    document.getElementById('quizQuestion').innerText = questionText;

    let options = [correctAnswer];
    let pool = rawVocabulary.map(x => (direction === "DE_TR") ? x.tr : x.de).filter(x => x !== correctAnswer);
    
    pool.sort(() => 0.5 - Math.random());
    for (let i = 0; i < 3 && i < pool.length; i++) {
        options.push(pool[i]);
    }
    options.sort(() => 0.5 - Math.random());

    const optionsContainer = document.getElementById('quizOptions');
    optionsContainer.innerHTML = "";

    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkQuizAnswer(btn, opt, correctAnswer);
        optionsContainer.appendChild(btn);
    });

    updateStats();
}

function checkQuizAnswer(selectedBtn, selectedOpt, correctOpt) {
    const allButtons = document.querySelectorAll('.opt-btn');
    allButtons.forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === correctOpt) {
            btn.classList.add('correct');
        }
    });

    if (selectedOpt !== correctOpt) {
        selectedBtn.classList.add('wrong');
    }
}

function nextQuizQuestion() {
    if (activeList.length === 0) return;
    currentIndex = (currentIndex + 1) % activeList.length;
    updateQuiz();
}

initApp();
</script>
